
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banda Kadosh</title>

<style>
* { box-sizing:border-box; }

body {
  margin:0;
  background:#090909;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

header {
  padding:35px 15px;
}

.logo {
  font-size:48px;
  font-weight:900;
  letter-spacing:5px;
}

.logo span { color:#e32938; }

header p {
  color:#e32938;
  letter-spacing:4px;
}

#menu {
  max-width:600px;
  margin:20px auto;
  padding:15px;
}

.song {
  display:block;
  width:100%;
  padding:18px;
  margin:12px 0;
  border:1px solid #a51e2c;
  border-radius:12px;
  background:#1b1113;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.song:hover { background:#a51e2c; }

#presentation {
  display:none;
  padding:20px;
}

.slide {
  max-width:850px;
  min-height:330px;
  margin:20px auto;
  padding:35px 15px;
  background:#171113;
  border:1px solid #9e2634;
  border-radius:18px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

#songTitle {
  color:#e32938;
  font-size:24px;
}

#lyrics {
  font-size:clamp(23px,4vw,36px);
  line-height:1.7;
  white-space:pre-line;
  font-weight:bold;
}

.controls {
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:12px;
  margin:20px;
}

.controls button {
  padding:14px 25px;
  background:#b82030;
  color:white;
  border:0;
  border-radius:30px;
  font-weight:bold;
  cursor:pointer;
}

#counter {
  color:#aaa;
  margin:15px;
}

#back {
  background:#333;
}

footer {
  padding:35px;
  color:#777;
}
</style>
</head>

<body>

<header>
  <div class="logo">BANDA <span>KADOSH</span></div>
  <p>🔥 LOUVORZÃO 🔥</p>
  <small>Oséias 6:1-2</small>
</header>

<section id="menu">
  <h2>ESCOLHA O LOUVOR</h2>
  <div id="songList"></div>
</section>

<section id="presentation">
  <div class="slide">
    <h2 id="songTitle"></h2>
    <p id="lyrics"></p>
  </div>

  <div id="counter"></div>

  <div class="controls">
    <button id="back" onclick="previous()">ANTERIOR</button>
    <button onclick="next()">PRÓXIMO →</button>
  </div>

  <div class="controls">
    <button onclick="closePresentation()">VOLTAR À LISTA</button>
  </div>
</section>

<footer>
  BANDA KADOSH<br>
  Uma geração que adora a Deus ❤️
</footer>

<script>
const songs = [
  {
    title:"EU ME LEMBRO",
    artist:"MORADA",
    slides:["Cole aqui a primeira parte autorizada da letra."]
  },
  {
    title:"DE VOLTA",
    artist:"BANDA KADOSH",
    slides:["Cole aqui a primeira parte autorizada da letra."]
  },
  {
    title:"COMO ANTIGAMENTE",
    artist:"BANDA KADOSH",
    slides:["Cole aqui a primeira parte autorizada da letra."]
  },
  {
    title:"O SENHOR, NÃO OS ÍDOLOS",
    artist:"THAMIRES GARCIA",
    slides:["Cole aqui a primeira parte autorizada da letra."]
  },
  {
    title:"HÁ UM VINHO NOVO",
    artist:"MINISTÉRIO ZOE",
    slides:["Cole aqui a primeira parte autorizada da letra."]
  }
];

let currentSong = 0;
let currentSlide = 0;

const songList = document.getElementById("songList");

songs.forEach((song,index) => {
  const button = document.createElement("button");
  button.className = "song";
  button.textContent = song.title + " — " + song.artist;
  button.onclick = () => openSong(index);
  songList.appendChild(button);
});

function openSong(index) {
  currentSong = index;
  currentSlide = 0;

  document.getElementById("menu").style.display = "none";
  document.getElementById("presentation").style.display = "block";

  showSlide();
}

function showSlide() {
  const song = songs[currentSong];

  document.getElementById("songTitle").textContent =
    song.title + " — " + song.artist;

  document.getElementById("lyrics").textContent =
    song.slides[currentSlide];

  document.getElementById("counter").textContent =
    "Slide " + (currentSlide + 1) + " de " + song.slides.length;
}

function next() {
  if(currentSlide < songs[currentSong].slides.length - 1) {
    currentSlide++;
    showSlide();
  }
}

function previous() {
  if(currentSlide > 0) {
    currentSlide--;
    showSlide();
  }
}

function closePresentation() {
  document.getElementById("presentation").style.display = "none";
  document.getElementById("menu").style.display = "block";
}
</script>

</body>
</html>
