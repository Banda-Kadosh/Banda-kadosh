
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banda Kadosh</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #0b090a;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 65px 15px 35px;
}

.logo {
  font-size: clamp(45px, 11vw, 78px);
  font-weight: 900;
  letter-spacing: 8px;
}

.logo span {
  display: block;
  color: #e32938;
}

.subtitle {
  color: #e32938;
  letter-spacing: 5px;
  margin-top: 15px;
}

.verse {
  color: #aaa;
  margin-top: 20px;
  line-height: 1.7;
}

main {
  max-width: 700px;
  width: 90%;
  margin: auto;
}

h2 {
  color: #e32938;
  text-align: center;
  margin: 30px 0;
  letter-spacing: 3px;
}

.song {
  background: #191315;
  border: 1px solid #462027;
  border-radius: 15px;
  margin-bottom: 16px;
  overflow: hidden;
}

.song button {
  width: 100%;
  padding: 22px;
  background: transparent;
  border: none;
  color: white;
  text-align: left;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.artist {
  display: block;
  color: #d34a57;
  font-size: 13px;
  margin-top: 8px;
}

.details {
  display: none;
  padding: 0 22px 22px;
  color: #ccc;
  line-height: 1.7;
}

.details.open {
  display: block;
}

.details a {
  display: inline-block;
  background: #b91f30;
  color: white;
  padding: 12px 18px;
  border-radius: 30px;
  text-decoration: none;
  margin-top: 12px;
}

footer {
  text-align: center;
  padding: 40px 15px;
  color: #888;
}

</style>
</head>

<body>

<header>
  <div class="logo">
    BANDA
    <span>KADOSH</span>
  </div>

  <div class="subtitle">🔥 LOUVORZÃO 🔥</div>

  <p class="verse">
    Vinde, voltemos ao Senhor.<br>
    Oséias 6:1-2
  </p>
</header>

<main>
<h2>NOSSOS LOUVORES</h2>

<div id="songs"></div>
</main>

<footer>
  BANDA KADOSH<br>
  Uma geração que adora a Deus.<br>
  © 2026
</footer>

<script>
const musicas = [
  ["EU ME LEMBRO", "Morada"],
  ["DE VOLTA", "Louvor"],
  ["COMO ANTIGAMENTE", "Louvor"],
  ["O SENHOR, NÃO OS ÍDOLOS", "Thamires Garcia"],
  ["HÁ UM VINHO NOVO", "Ministério Zoe"]
];

const lista = document.getElementById("songs");

musicas.forEach((musica, i) => {
  const card = document.createElement("section");
  card.className = "song";

  const botao = document.createElement("button");
  botao.innerHTML = `
    ♫ ${musica[0]}
    <span class="artist">${musica[1]}</span>
  `;

  const detalhes = document.createElement("div");
  detalhes.className = "details";

  const texto = document.createElement("p");
  texto.textContent = "Louvor " + (i + 1) + " da Banda Kadosh.";

  const link = document.createElement("a");
  link.href = "https://www.youtube.com/results?search_query=" +
    encodeURIComponent(musica[0] + " " + musica[1]);
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  link.textContent = "OUVIR NO YOUTUBE";

  detalhes.append(texto, link);

  botao.addEventListener("click", () => {
    detalhes.classList.toggle("open");
  });

  card.append(botao, detalhes);
  lista.append(card);
});
</script>

</body>
</html>
