<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Banda Kadosh | Medley 2</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

.inicio,
.slide {
    min-height: 100vh;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 30px;
    background: radial-gradient(circle, #3d0000, #050505 70%);
}

.slide {
    display: none;
}

.slide.ativo {
    display: flex;
}

.conteudo {
    width: 100%;
    max-width: 1100px;
}

.logo {
    font-size: clamp(45px, 8vw, 90px);
    font-weight: bold;
    letter-spacing: 8px;
}

.logo span {
    color: #e00000;
}

.medley {
    margin-top: 20px;
    color: #ff3030;
    font-size: 25px;
    letter-spacing: 5px;
}

.musicas {
    margin-top: 20px;
    font-size: 18px;
    line-height: 1.8;
    color: #ddd;
}

.tema {
    margin-top: 25px;
    color: #aaa;
    letter-spacing: 3px;
}

.botao {
    margin-top: 40px;
    padding: 18px 40px;
    border: 2px solid #ff3030;
    border-radius: 50px;
    background: #850000;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.titulo {
    color: #ff3030;
    font-size: 24px;
    letter-spacing: 5px;
    margin-bottom: 35px;
    text-transform: uppercase;
}

.letra {
    font-size: clamp(25px, 4vw, 55px);
    line-height: 1.5;
    font-weight: bold;
}

.controles {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    display: none;
    gap: 10px;
    z-index: 10;
}

.controles.ativo {
    display: flex;
}

.controles button {
    padding: 12px 22px;
    background: #850000;
    color: white;
    border: 1px solid #ff3030;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
}

.numero {
    position: fixed;
    top: 20px;
    right: 25px;
    color: #aaa;
    display: none;
}

.numero.ativo {
    display: block;
}

@media(max-width:700px) {
    .logo {
        font-size: 42px;
    }

    .letra {
        font-size: 25px;
    }

    .musicas {
        font-size: 15px;
    }
}
</style>
</head>
