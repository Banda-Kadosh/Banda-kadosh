<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Banda Kadosh | Medley</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* ==========================
   TELA INICIAL
========================== */

.inicio {
    height: 100vh;
    width: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;

    background:
        radial-gradient(circle at center, #3d0000, #080000 45%, #000 80%);
}

.conteudo {
    max-width: 1100px;
    width: 90%;
    position: relative;
    z-index: 2;
}

.logo {
    font-size: clamp(45px, 8vw, 95px);
    font-weight: bold;
    letter-spacing: 10px;
}

.logo span {
    color: #e00000;
}

.medley {
    margin-top: 25px;
    color: #ff2020;
    font-size: 24px;
    letter-spacing: 5px;
}

.musicas {
    margin-top: 15px;
    color: #ddd;
    font-size: 18px;
    line-height: 1.8;
}

.tema {
    margin-top: 25px;
    color: #999;
    letter-spacing: 4px;
}

/* ==========================
   BOTÃO
========================== */

.botao {
    margin-top: 45px;

    padding: 18px 42px;

    border: 2px solid #ff2020;
    border-radius: 50px;

    background: #850000;
    color: white;

    font-size: 17px;
    font-weight: bold;

    letter-spacing: 3px;

    cursor: pointer;

    text-decoration: none;
    display: inline-block;

    box-shadow: 0 0 30px rgba(255,0,0,.35);

    transition: .3s;
}

.botao:hover {
    background: #d00000;
    transform: scale(1.05);
}

/* ==========================
   SLIDES
========================== */
