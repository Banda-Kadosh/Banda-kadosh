<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banda Kadosh | O Senhor, Não os Ídolos</title>
<style>
:root{--red:#e00000;--dark:#050505;--panel:#101010;--white:#f7f7f7}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at center,#3b0710 0%,#180308 42%,#030303 100%);color:var(--white);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
.cover{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 22px}
.cover-brand{font-size:clamp(2.5rem,10vw,4.4rem);font-weight:900;letter-spacing:8px;line-height:1.15}
.cover-brand span{display:block;color:#ff251b;text-shadow:0 0 18px #ff251b55}
.cover-song{margin-top:30px;color:#ff4038;font-size:clamp(1rem,4vw,1.4rem);font-weight:800;letter-spacing:5px;text-transform:uppercase}
.cover-artist{margin-top:24px;font-size:1.2rem;font-weight:800;letter-spacing:2px}
.cover-sub{margin-top:24px;font-size:.95rem;font-weight:800;letter-spacing:4px}
.cover .startbtn{margin-top:58px;background:#ff2b16;border-color:#ff2b16;border-radius:999px;padding:17px 30px;box-shadow:0 0 24px #ff2b1666}
#lyricsPage[hidden]{display:none}
button{font:inherit;cursor:pointer}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid #4a0000;background:#050505cc}
.brand{font-weight:900;letter-spacing:4px;text-transform:uppercase}.brand span{color:var(--red);text-shadow:0 0 15px #e00000}
.actions{display:flex;gap:8px}.smallbtn,.navbtn,.startbtn{background:#160000;color:white;border:1px solid var(--red);border-radius:10px;padding:10px 14px;box-shadow:0 0 12px #e0000022}
.smallbtn:hover,.navbtn:hover,.startbtn:hover{background:#380000;box-shadow:0 0 18px #e0000066}
main{width:min(900px,100%);margin:0 auto;padding:28px 18px 42px}
.hero{text-align:center;padding:24px 10px 30px}
.kicker{color:#ff5555;letter-spacing:4px;font-size:.76rem;text-transform:uppercase}
h1{font-size:clamp(2rem,7vw,4rem);line-height:1.04;margin:14px 0;text-transform:uppercase;text-shadow:0 0 24px #e000004d}
.artist{color:#d6d6d6;font-size:1.1rem}
.redline{height:3px;width:100px;background:var(--red);margin:24px auto;box-shadow:0 0 18px var(--red)}
.stage{border:1px solid #560000;border-radius:20px;background:linear-gradient(145deg,#130303,#080808 70%);padding:clamp(22px,5vw,48px);min-height:310px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 0 32px #e0000012}
.counter{color:#ff5555;text-transform:uppercase;letter-spacing:3px;font-size:.78rem;margin-bottom:24px}
.lyrics{font-size:clamp(1.35rem,4.7vw,2.25rem);font-weight:700;line-height:1.55;white-space:pre-line;text-shadow:0 0 14px #ffffff12}
.controls{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px}
.navbtn{min-width:125px}.navbtn:disabled{opacity:.35;cursor:not-allowed}
.startbtn{padding:14px 24px;font-weight:800;text-transform:uppercase;letter-spacing:1px}
.progress{height:4px;background:#2b1111;border-radius:99px;overflow:hidden;margin-top:22px}.progress span{display:block;height:100%;width:0;background:var(--red);box-shadow:0 0 10px var(--red);transition:width .2s}
.hint{text-align:center;color:#999;font-size:.85rem;margin-top:16px}
footer{text-align:center;padding:24px 12px;color:#777;font-size:.8rem;letter-spacing:2px}
@media(max-width:480px){.topbar{padding:14px 12px}.brand{letter-spacing:2px;font-size:.88rem}.smallbtn{padding:9px 10px}.stage{min-height:280px}.navbtn{min-width:110px}}
</style>
</head>
<body>
<section class="cover" id="coverPage">
  <div class="cover-brand">BANDA<span>KADOSH</span></div>
  <div class="cover-song">O SENHOR, NÃO OS ÍDOLOS</div>
  <div class="cover-artist">THAMIRES GARCIA</div>
  <div class="cover-sub">MINISTRAÇÃO • LOUVOR E ADORAÇÃO</div>
  <button class="startbtn" id="startBtn" type="button">▶ INICIAR MÚSICA</button>
</section>
<div id="lyricsPage" hidden>
<header class="topbar">
  <div class="brand">Banda <span>Kadosh</span></div>
  <div class="actions">
    <button class="smallbtn" id="fullscreenBtn" type="button">⛶ Tela cheia</button>
  </div>
</header>
<main>
  <section class="hero">
    <div class="kicker">O Senhor, não os ídolos</div>
    <h1>O Senhor,<br>Não os Ídolos</h1>
    <div class="artist">Thamires Garcia</div>
    <div class="redline"></div>
  </section>
  <section class="stage" aria-live="polite">
    <div class="counter" id="counter">Trecho 1</div>
    <div class="lyrics" id="lyrics"></div>
  </section>
  <div class="controls">
    <button class="navbtn" id="prevBtn" type="button" disabled>← Anterior</button>
    <button class="navbtn" id="nextBtn" type="button" disabled>Próxima →</button>
  </div>
  <div class="progress"><span id="progressBar"></span></div>
  <div class="hint">Use as setas do teclado ← → para trocar os trechos.</div>
</main>
<footer>BANDA KADOSH • O SENHOR, NÃO OS ÍDOLOS</footer>
</div>
<script>
const slides = [
`Pecamos, Senhor
O nosso coração está tão longe
E estes nossos ídolos nos fizeram cegos como eles são
Faz de novo o povo saber
Que além de Ti não há mais nenhum Deus`,
`Quem mais poderia dizer
Aquilo que vai acontecer no futuro?
Quem mais poderia fazer
Aquilo que se fez desde os tempos antigos?
O Senhor, e não os ídolos
O Senhor, e não os ídolos`,
`Quem mais poderia dizer
Aquilo que vai acontecer no futuro?
Quem mais poderia fazer
Aquilo que se fez desde os tempos antigos?
Só o Senhor, e não os ídolos
O Senhor, e não os ídolos`,
`É como está escrito
Assim diz o Senhor
Eu me lembro de você, meu povo
Da sua afeição quando você era jovem
Do seu amor quando noiva
E de como você me seguia no deserto
Numa terra em que não se semeia`,
`Escutem a palavra do Senhor
Que injustiça seus pais acharam em mim
Para que se afastassem assim
Seguindo ídolos sem valor e tornando-se como eles?
Ninguém perguntou por mim!`,
`Os sacerdotes não disseram: Onde está o Senhor?
Os que tratavam da lei não me conheceram
Os pastores se revoltaram contra mim
Os profetas profetizaram por Baal
E o meu povo trocou a sua glória
Por aquilo que não tem proveito algum
E cometeu dois males
A mim me abandonaram, Fonte de Águas Vivas
E cavaram cisternas rachadas!`,
`Oh, geração
Considere a palavra do Senhor!
Será que eu tenho sido um deserto pra vocês?
Então, por que vocês dizem
Somos livres pra fazer o que quisermos?
Mas reconhece agora que você transgrediu contra o Senhor
E se prostituiu com estranhos
E não deu ouvidos a minha voz
Volte pra mim, meu povo, voltem, filhos!
Voltem! E eu os levarei a Sião`,
`Derruba os amores rivais
Expõe todos esses amantes
E traz o nosso coração de volta ao dia do primeiro amor`,
`Pois é como está escrito
Eu me lembro bem, diz o Senhor
Eu me lembro bem
De quando você era noiva e me seguia pelo deserto
Em uma terra em que não se semeia`,
`Ah, eu sei!
Ah, eu sei que o Senhor se lembra
Dos dias do primeiro amor da sua igreja
Eu sei que estás chamando a sua amada de novo`,
`Quem mais poderia dizer?
Quem mais poderia dizer
Aquilo que vai acontecer no futuro?
Quem mais poderia fazer
Aquilo que se fez desde os tempos antigos?
O Senhor, e não os ídolos
Só o Senhor, e não os ídolos`,
`O Senhor, não os ídolos
O Senhor, não os ídolos
O Senhor, não os ídolos
O Senhor, não os ídolos
Só o Senhor, e não os ídolos
O Senhor, e não os ídolos`,
`E nós declaramos a nossa devoção para sempre`,
`O Senhor, não os ídolos
O Senhor, não os ídolos
O Senhor, não os ídolos (tu serás o primeiro)
O Senhor, não os ídolos
Só o Senhor, e não os ídolos
O Senhor, e não os ídolos`,
`Eles têm boca e não falam
Têm olhos e não veem
Têm mãos e não apalpam
Têm pés e não caminham`,
`Só o Senhor é Deus, não os ídolos
O Senhor, não os ídolos`,
`Eles têm boca e não podem falar, Senhor
Eles têm boca e não falam
Têm olhos e não veem
Têm mãos e não apalpam
Têm pés e não caminham`,
`Só o Senhor é Deus, não os ídolos
O Senhor, e não os ídolos`,
`O Senhor, mais ninguém
O Senhor, só o Senhor
Diga a Ele`,
`O Senhor, não os ídolos
O Senhor, não os ídolos
O Senhor, não os ídolos
O Senhor, não os ídolos
Só o Senhor, e não os ídolos
O Senhor, e não os ídolos`
];
let current = -1;
const lyrics = document.getElementById('lyrics');
const counter = document.getElementById('counter');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const startBtn = document.getElementById('startBtn');
const progressBar = document.getElementById('progressBar');
function showSlide(index){
  current = Math.max(0, Math.min(index, slides.length - 1));
  lyrics.textContent = slides[current];
  counter.textContent = `Trecho ${current + 1} de ${slides.length}`;
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === slides.length - 1;
  startBtn.textContent = current === slides.length - 1 ? '↻ Recomeçar' : '▶ Próximo trecho';
  progressBar.style.width = `${((current + 1) / slides.length) * 100}%`;
}
startBtn.addEventListener('click', () => {
  if (current < 0) {
    document.getElementById('coverPage').hidden = true;
    document.getElementById('lyricsPage').hidden = false;
    showSlide(0);
  } else if (current === slides.length - 1) {
    showSlide(0);
  } else {
    showSlide(current + 1);
  }
});
prevBtn.addEventListener('click', () => { if(current > 0) showSlide(current - 1); });
nextBtn.addEventListener('click', () => { if(current < slides.length - 1) showSlide(current + 1); });
document.getElementById('fullscreenBtn').addEventListener('click', async () => {
  try {
    if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  } catch(e) { alert('A tela cheia não está disponível neste navegador.'); }
});
document.addEventListener('keydown', e => {
  if(e.key === 'ArrowRight' && current < slides.length - 1) showSlide(current < 0 ? 0 : current + 1);
  if(e.key === 'ArrowLeft' && current > 0) showSlide(current - 1);
});

// A capa aparece primeiro; a letra abre ao tocar em "Iniciar música".
</script>
</body>
</html>
